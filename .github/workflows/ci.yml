name: SmartTest checks

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - '.github/**'
              - 'client/**'
              - 'core/**'
            web:
              - '.github/**'
              - 'web/**'
              - 'core/devtools/**'
            mobile:
              - '.github/**'
              - 'mobile/**'
              - 'core/**'

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: python -m pip install pytest
      - run: python core/devtools/smarttest.py check client

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/frontend/package-lock.json}
      - run: python -m pip install -r web/backend/requirements-dev.txt
      - run: npm ci
        working-directory: web/frontend
      - run: python core/devtools/smarttest.py check web

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - run: python core/devtools/smarttest.py check mobile
